# ============================================================
# RRS — 后端服务配置
# ============================================================

spring:
  application:
    name: znty-rrs
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/znty_rrs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: MTIzNDU2

  # HTTP 文件上传配置（Boot 2.x 使用 spring.servlet.multipart）
  servlet:
    multipart:
      # 单个文件最大 50MB
      max-file-size: 50MB
      # 单次请求总大小最大 200MB（含多文件）
      max-request-size: 200MB

  # JSON 日期时间序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 18090
  # HTTP Servlet 编码：强制响应使用 UTF-8，避免中文乱码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true

# MyBatis ORM 框架配置
mybatis:
  # Mapper XML 文件扫描路径（classpath* 表示扫描所有 jar 包中的 mapper 目录）
  mapper-locations: classpath*:mapper/**/*.xml
  # 开启驼峰命名映射：数据库字段 user_name 自动映射为 Java 属性 userName
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件（由 pagehelper-spring-boot-starter 自动装配）
pagehelper:
  helper-dialect: mysql
  # 页码合理化：超出范围时自动修正到首页或末页
  reasonable: true
  support-methods-arguments: true
  # 将 RowBounds 的 offset 参数当作页码使用
  offset-as-page-num: true
  # 使用 RowBounds 分页时同时执行 count 查询
  row-bounds-with-count: true


# 日志配置
logging:
  level:
    com.znty.rrs.mapper: DEBUG

# RRS 业务配置：附件管理模块
rrs:
  attachment:
    storage-path: ${RRS_ATTACHMENT_STORAGE_PATH:D:/uploads/znty_rrs}
  hs-pool-export:
    storage-path: ${RRS_HS_POOL_EXPORT_STORAGE_PATH:D:/uploads/znty_rrs/hs-pool-export}
  script:
    # SQL 脚本目录（相对 user.dir 或绝对路径）
    sql-path: ${RRS_SCRIPT_SQL_PATH:sql}
    # 脚本工具总开关：开发/演示默认 true；生产务必 false（写操作拒绝执行）
    enabled: ${RRS_SCRIPT_ENABLED:true}
  # 定时任务启停/cron/扩展参数已迁至库表 sys_scheduled_task，由「RRS配置 → 定时任务管理」可视化维护
  # 历史环境变量（RRS_AUTO_ADJUST_* / RRS_COMPANY_NEW_BOND_*）不再读取；首次建表见 rrs_scheduled_task_schema.sql
